name: Issue 162 diagnostic CI baseline (temporary)

# Diagnostic-only workflow for Issue #162 investigation.
# Manual dispatch only. No push/schedule trigger. No deploy job. No Pages/production permissions.
# Runs the exact regression test 10x on desktop and 10x on mobile-webkit-320, alternating,
# workers=1, retries=0, to establish a CI-native baseline failure rate. Does not modify
# application code, tests, or the ordinary CI/CD workflows.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-162-ci-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: pnpm/action-setup@v4
        with: { version: '11.9.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }

      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build normalized aggregates
        run: pnpm build:aggregates
      - name: Build React production artifact
        run: pnpm build

      - name: Record environment
        run: |
          echo "node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "playwright: $(pnpm exec playwright --version)"
          echo "runner image: $ImageOS $ImageVersion"
          nproc || true
          free -h || true
          df -h . || true

      - name: Run 10 desktop + 10 mobile-webkit-320 independent invocations (alternating)
        id: baseline
        run: |
          set +e
          mkdir -p ci-baseline-results
          summary="ci-baseline-results/summary.json"
          echo "[" > "$summary"
          first=true
          TEST_TITLE="quality disclosure close-button keyboard activation restores focus to trigger"

          for i in $(seq 1 10); do
            for project in desktop mobile-webkit-320; do
              run_id="${project}-run${i}"
              echo "=== $run_id ==="
              start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              t0=$(date +%s%3N)
              npx playwright test \
                --config=playwright.react.config.mjs \
                --project="$project" \
                --workers=1 \
                --retries=0 \
                -g "$TEST_TITLE" \
                --reporter=list,json \
                --output="ci-baseline-results/${run_id}" \
                > "ci-baseline-results/${run_id}.log" 2>&1
              code=$?
              t1=$(date +%s%3N)
              end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              duration_ms=$((t1 - t0))

              if [ "$first" = true ]; then first=false; else echo "," >> "$summary"; fi
              printf '{"run_id":"%s","project":"%s","iteration":%d,"start":"%s","end":"%s","exit_code":%d,"process_duration_ms":%d}' \
                "$run_id" "$project" "$i" "$start" "$end" "$code" "$duration_ms" >> "$summary"

              echo "exit=$code duration_ms=$duration_ms"
            done
          done
          echo "]" >> "$summary"
          cat "$summary"
        env:
          CI: "true"

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-162-ci-baseline-evidence
          path: |
            ci-baseline-results/
          if-no-files-found: warn
          retention-days: 14
