name: Issue 162 Tab cross-overlay race Linux CI repetition (temporary)

# Disposable verification-only workflow. Confirms the synchronous-autofocus
# fix (branch fix/162-quality-disclosure-focus-race, this branch is forked
# from its exact head) achieves 0/10 failures on real Linux CI for the full
# keyboard-acceptance test group (initial focus, Tab, Shift+Tab, Space,
# Enter, intentional handoff) on both desktop-webkit and mobile-webkit-320,
# workers=1, retries=0, 10 independent process invocations each, alternating.
# NOT part of PR #165's diff and will not be merged; disposed of after
# evidence capture, same lifecycle as PR #164/#166/#167.
# No deploy job, no Pages/production permissions, no push-trigger for main.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-162-tab-race-repetition.yml'

permissions:
  contents: read

concurrency:
  group: issue-162-tab-race-repetition
  cancel-in-progress: false

jobs:
  repetition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: pnpm/action-setup@v4
        with: { version: '11.9.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }

      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build normalized aggregates
        run: pnpm build:aggregates
      - name: Build React production artifact
        run: pnpm build

      - name: Run 10 desktop-webkit + 10 mobile-webkit-320 independent full-keyboard-contract invocations (alternating)
        id: repetition
        run: |
          set +e
          mkdir -p ci-tab-race-results
          summary="ci-tab-race-results/summary.json"
          echo "[" > "$summary"
          first=true
          TEST_GREP="issue #162 acceptance"

          for i in $(seq 1 10); do
            for project in desktop-webkit mobile-webkit-320; do
              run_id="${project}-run${i}"
              echo "=== $run_id ==="
              start=$(date -u +%Y-%m-%dT%H:%M:%SZ); t0=$(date +%s%3N)
              npx playwright test \
                --config=playwright.react.config.mjs \
                --project="$project" \
                --workers=1 \
                --retries=0 \
                -g "$TEST_GREP" \
                --reporter=list,json \
                --output="ci-tab-race-results/${run_id}" \
                > "ci-tab-race-results/${run_id}.log" 2>&1
              code=$?
              t1=$(date +%s%3N); end=$(date -u +%Y-%m-%dT%H:%M:%SZ); duration_ms=$((t1 - t0))
              if [ "$first" = true ]; then first=false; else echo "," >> "$summary"; fi
              printf '{"run_id":"%s","project":"%s","iteration":%d,"start":"%s","end":"%s","exit_code":%d,"process_duration_ms":%d}' \
                "$run_id" "$project" "$i" "$start" "$end" "$code" "$duration_ms" >> "$summary"
              echo "exit=$code duration_ms=$duration_ms"
            done
          done
          echo "]" >> "$summary"
          cat "$summary"
        env:
          CI: "true"

      - name: Upload Tab race repetition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-162-tab-race-repetition-evidence
          path: |
            ci-tab-race-results/
          if-no-files-found: warn
          retention-days: 14
